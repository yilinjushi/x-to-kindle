name: Kindle Delivery

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 11:00 UTC = 19:00 UTC+8.
    # Run the scheduler daily, then gate actual delivery to every 3 days.
    - cron: "0 11 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: kindle-delivery
  cancel-in-progress: false

jobs:
  cadence-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.cadence.outputs.run }}
    steps:
      - name: Check 3-day delivery cadence
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First scheduled run after restoration: 2026-09-25 19:00 UTC+8.
          BASE_DATE="2026-09-25"
          TODAY="$(date -u +%F)"
          BASE_EPOCH="$(date -u -d "$BASE_DATE" +%s)"
          TODAY_EPOCH="$(date -u -d "$TODAY" +%s)"
          DAYS_SINCE=$(( (TODAY_EPOCH - BASE_EPOCH) / 86400 ))

          if [ "$DAYS_SINCE" -ge 0 ] && [ $(( DAYS_SINCE % 3 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  send-bookmarks:
    needs: cadence-gate
    if: needs.cadence-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MIN_TEXT_CHARS: "1200"
      TARGET_COUNT: "15"
      ARCHIVE_DIR: ${{ github.workspace }}/archive-repo/archive
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out private archive
        uses: actions/checkout@v4
        with:
          repository: yilinjushi/x-to-kindle-archive
          path: archive-repo
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Restore X session
        shell: bash
        run: |
          cat <<'EOF' > x_session.json
          ${{ secrets.X_SESSION_JSON }}
          EOF

      - name: Run bookmark delivery
        run: python fetch_bookmarks.py

      - name: Commit archive updates to private archive
        shell: bash
        working-directory: archive-repo
        run: |
          git add archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive delivered X bookmarks"
          git pull --rebase
          git push

      - name: Commit sent-history and site updates
        shell: bash
        run: |
          git add state/sent_articles.json site/
          if git diff --cached --quiet; then
            echo "No sent-history or site changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Kindle sent article history"
          git pull --rebase
          git push
