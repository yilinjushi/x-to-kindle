name: Kindle Delivery

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: kindle-delivery
  cancel-in-progress: false

jobs:
  send-bookmarks:
    runs-on: ubuntu-latest
    env:
      KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MIN_TEXT_CHARS: "1200"
      TARGET_COUNT: "15"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Restore X session
        shell: bash
        run: |
          cat <<'EOF' > x_session.json
          ${{ secrets.X_SESSION_JSON }}
          EOF

      - name: Run bookmark delivery
        run: python fetch_bookmarks.py

      - name: Commit sent-history and archive updates
        shell: bash
        run: |
          git add state/sent_articles.json archive/ site/
          if git diff --cached --quiet; then
            echo "No sent-history or archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sent article history and archive"
          git pull --rebase
          git push
