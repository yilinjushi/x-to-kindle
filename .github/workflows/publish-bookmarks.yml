name: Publish Bookmarks To Blog

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of recent bookmarks to publish
        required: true
        default: "15"
        type: string
  schedule:
    # 10:30 UTC, 30 minutes before Kindle delivery; gated to the same 3-day cadence.
    - cron: "30 10 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-bookmarks
  cancel-in-progress: false

jobs:
  cadence-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.cadence.outputs.run }}
    steps:
      - name: Check 3-day publishing cadence
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same cadence as kindle-delivery.yml, starting 2026-09-25.
          BASE_DATE="2026-09-25"
          TODAY="$(date -u +%F)"
          BASE_EPOCH="$(date -u -d "$BASE_DATE" +%s)"
          TODAY_EPOCH="$(date -u -d "$TODAY" +%s)"
          DAYS_SINCE=$(( (TODAY_EPOCH - BASE_EPOCH) / 86400 ))

          if [ "$DAYS_SINCE" -ge 0 ] && [ $(( DAYS_SINCE % 3 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  publish-bookmarks:
    needs: cadence-gate
    if: needs.cadence-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      ARCHIVE_DIR: ${{ github.workspace }}/archive-repo/archive
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out private archive
        uses: actions/checkout@v4
        with:
          repository: yilinjushi/x-to-kindle-archive
          path: archive-repo
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Restore X session
        shell: bash
        run: |
          cat <<'EOF' > x_session.json
          ${{ secrets.X_SESSION_JSON }}
          EOF

      - name: Archive recent bookmarks without Kindle delivery
        env:
          BOOKMARK_COUNT: ${{ inputs.count || '50' }}
        run: python fetch_bookmarks.py --archive-only --count "$BOOKMARK_COUNT"

      - name: Commit archive updates to private archive
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: archive-repo
        run: |
          git add archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive recent X bookmarks"
          git pull --rebase
          git push

      - name: Commit site updates
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git add site/
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish recent X bookmarks to blog"
          git pull --rebase
          git push
