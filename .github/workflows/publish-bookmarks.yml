name: Publish Bookmarks To Blog

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of recent bookmarks to publish
        required: true
        default: "15"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-bookmarks
  cancel-in-progress: false

jobs:
  publish-bookmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Restore X session
        shell: bash
        run: |
          cat <<'EOF' > x_session.json
          ${{ secrets.X_SESSION_JSON }}
          EOF

      - name: Archive recent bookmarks without Kindle delivery
        run: python fetch_bookmarks.py --archive-only --count "${{ inputs.count }}"

      - name: Commit archive and site updates
        shell: bash
        run: |
          git add archive/ site/
          if git diff --cached --quiet; then
            echo "No archive or site changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish recent X bookmarks to blog"
          git pull --rebase
          git push
