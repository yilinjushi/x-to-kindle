name: Publish Bookmarks To Blog

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of recent bookmarks to scan
        required: true
        default: "50"
        type: string
      max_new:
        description: Stop after archiving this many new bookmarks (0 = no limit)
        required: true
        default: "10"
        type: string
  # No schedule: triggered by the "同步" button on the site (functions/api/sync.js).

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-bookmarks
  cancel-in-progress: false

jobs:
  publish-bookmarks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      ARCHIVE_DIR: ${{ github.workspace }}/archive-repo/archive
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out private archive
        uses: actions/checkout@v4
        with:
          repository: yilinjushi/x-to-kindle-archive
          path: archive-repo
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Restore X session
        shell: bash
        run: |
          cat <<'EOF' > x_session.json
          ${{ secrets.X_SESSION_JSON }}
          EOF

      - name: Archive recent bookmarks without Kindle delivery
        env:
          BOOKMARK_COUNT: ${{ inputs.count || '50' }}
          MAX_NEW: ${{ inputs.max_new || '10' }}
        run: python fetch_bookmarks.py --archive-only --count "$BOOKMARK_COUNT" --max-new "$MAX_NEW"

      - name: Commit archive updates to private archive
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: archive-repo
        run: |
          git add archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive recent X bookmarks"
          git pull --rebase
          git push

      - name: Commit site updates
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git add site/
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish recent X bookmarks to blog"
          git pull --rebase
          git push
