name: Send Web To Kindle

on:
  workflow_dispatch:
    inputs:
      url:
        description: Article URL to send
        required: true
        type: string
      title:
        description: Optional title from Shortcut
        required: false
        type: string
      source:
        description: Source label
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: send-web-to-kindle
  cancel-in-progress: false

jobs:
  send-web-article:
    runs-on: ubuntu-latest
    env:
      KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ARCHIVE_DIR: ${{ github.workspace }}/archive-repo/archive
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out private archive
        uses: actions/checkout@v4
        with:
          repository: yilinjushi/x-to-kindle-archive
          path: archive-repo
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Send web article
        run: >
          python send_web_article.py
          --url "${{ inputs.url }}"
          --title "${{ inputs.title }}"
          --source "${{ inputs.source || 'iphone_shortcut' }}"

      - name: Commit archive updates to private archive
        shell: bash
        working-directory: archive-repo
        run: |
          git add archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive web article"
          git pull --rebase
          git push

      - name: Commit sent-web history and site updates
        shell: bash
        run: |
          git add state/sent_web_articles.json site/
          if git diff --cached --quiet; then
            echo "No sent-web history or site changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sent web article history and site"
          git pull --rebase
          git push
