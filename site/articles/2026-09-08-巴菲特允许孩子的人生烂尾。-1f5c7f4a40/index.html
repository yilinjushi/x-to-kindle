<p>大儿子辍学去务农，</p>
<p>女儿辍学去结婚当家庭主妇然后又离婚，</p>
<p>小儿子辍学去玩音乐。三个孩子不但没读名校，</p>
<p>连本科都没读下来。</p>
<p>这在东亚父母眼里简直是“大灾难”了。拿钱买学位也得买下来啊。</p>
<p>但巴菲特认为，人生是一道复杂的概率题，离婚、破产、职业迷茫都是必填项，</p>
<p>父母无权也无需替孩子跳过这些磨难，</p>
<p>因为跳过磨难就等于剥夺了孩子构建自我认知的机会。</p></div><a class="source" href="https://x.com/0xTraderYi/status/2077729958563389676" rel="noopener noreferrer">查看原文 ↗</a></article></main>
